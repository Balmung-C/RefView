<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RefView - Art Reference Manager</title>
  <style>
    :root {
      --bg-dark: #0f1115;
      --bg-panel: #161920;
      --bg-card: #202430;
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --border-color: #2a2e3d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER STYLES */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      flex-shrink: 0;
      z-index: 100;
    }

    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag {
      font-size: 0.7rem;
      background: rgba(79, 70, 229, 0.2);
      color: var(--accent-hover);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(79, 70, 229, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text-muted);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* MAIN WORKSPACE & PANES */
    .workspace {
      flex: 1;
      display: grid;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* Dynamic layouts based on active pane count (Max 6) */
    .workspace[data-panes="1"] { grid-template-columns: 1fr; }
    .workspace[data-panes="2"] { grid-template-columns: repeat(2, 1fr); }
    .workspace[data-panes="3"] { grid-template-columns: repeat(3, 1fr); }
    .workspace[data-panes="4"] { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    .workspace[data-panes="5"],
    .workspace[data-panes="6"] { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }

    .pane {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .pane-header {
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pane-search-form {
      display: flex;
      flex: 1;
      gap: 6px;
    }

    .pane-input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .pane-input:focus {
      outline: 1px solid var(--accent);
    }

    .pane-timer-select {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    /* PANE VIEWER AREA */
    .pane-viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #08090b;
    }

    .pane-image-wrapper {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pane-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .pane-img.grayscale { filter: grayscale(100%); }
    .pane-img.flipped { transform: scaleX(-1); }
    .pane-img.grayscale.flipped { transform: scaleX(-1); filter: grayscale(100%); }

    /* 3x3 Grid Overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .grid-overlay.active { opacity: 1; }

    .grid-overlay div {
      border: 1px dashed rgba(255, 255, 255, 0.25);
    }

    /* EMPTY STATE */
    .empty-pane-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 20px;
      text-align: center;
    }

    /* TIMER PROGRESS BAR */
    .timer-progress-container {
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .timer-progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
    }

    /* PANE FOOTER TOOLBAR */
    .pane-footer {
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid var(--border-color);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-tool {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-tool:hover {
      background: var(--bg-card);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-tool.active {
      color: var(--accent-hover);
      background: rgba(79, 70, 229, 0.15);
      border-color: rgba(79, 70, 229, 0.3);
    }

    /* COLLAPSIBLE BOTTOM DRAWER */
    .drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-header {
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .drawer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-content {
      flex: 1;
      padding: 10px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .saved-card {
      height: 100%;
      min-width: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .saved-card:hover {
      border-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .saved-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .saved-card .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.7);
      color: var(--danger);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .saved-card:hover .remove-btn {
      opacity: 1;
    }

    /* Hidden File Input for Board Import */
    #boardFileInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      RefView
      <span class="brand-tag">Workspace</span>
    </div>

    <div class="header-actions">
      <button id="addPaneBtn" class="btn" onclick="addPane()">+ Add Pane</button>
      <button class="btn" onclick="toggleDrawer()">📁 Saved (<span id="savedCount">0</span>)</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main id="workspace" class="workspace" data-panes="2"></main>

  <!-- COLLAPSIBLE BOTTOM DRAWER -->
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <span>Saved References (Double-click thumbnail to view in pane)</span>
      <div class="drawer-actions">
        <button class="btn" onclick="saveBoard()" title="Save board state and saved thumbnails to a file">
          💾 Save Board
        </button>
        <button class="btn" onclick="triggerLoadBoard()" title="Load a saved board file">
          📂 Load Board
        </button>
        <button class="btn" style="color: var(--danger);" onclick="clearAllSaved()">Clear Saved</button>
        <button class="btn-tool" onclick="toggleDrawer()">✕ Close</button>
      </div>
    </div>
    <div id="drawerContent" class="drawer-content"></div>
  </div>

  <!-- HIDDEN FILE INPUT -->
  <input type="file" id="boardFileInput" accept=".json" onchange="handleLoadBoard(event)" />

  <script>
    const MAX_PANES = 6;
    const STORAGE_KEY = 'refview_saved_references';
    let paneCounter = 0;
    const panesData = new Map();
    let savedReferences = [];

    // Initialize workspace and load persistent saved references
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedFromLocalStorage();
      addPane();
      addPane();
    });

    function loadSavedFromLocalStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          savedReferences = JSON.parse(stored);
        }
      } catch (e) {
        console.warn("Could not read from localStorage:", e);
        savedReferences = [];
      }
      renderSavedDrawer();
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedReferences));
      } catch (e) {
        console.warn("Could not save to localStorage:", e);
      }
    }

    function renderSavedDrawer() {
      document.getElementById('savedCount').textContent = savedReferences.length;
      const drawerContent = document.getElementById('drawerContent');

      if (savedReferences.length === 0) {
        drawerContent.innerHTML = `
          <div style="color: var(--text-muted); font-size: 0.8rem; align-self: center; margin: auto;">
            No saved references yet. Click 💾 on any pane to save an image here.
          </div>`;
        return;
      }

      drawerContent.innerHTML = '';
      savedReferences.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'saved-card';
        card.title = 'Double-click to open in pane | Double-click ✕ to remove';
        card.ondblclick = () => openSavedInNewPane(item.imageUrl);

        card.innerHTML = `
          <img src="${item.imageUrl}" alt="Saved Reference" />
          <button class="remove-btn" title="Double-click to remove" 
                  ondblclick="event.stopPropagation(); removeSavedItem(${index})">✕</button>
        `;
        drawerContent.appendChild(card);
      });
    }

    async function saveCurrentReference(id) {
      const state = panesData.get(id);
      if (!state || !state.images.length) return;

      const current = state.images[state.currentIndex];
      
      // Save metadata to saved references list
      const exists = savedReferences.some(ref => ref.imageUrl === current.imageUrl);
      if (!exists) {
        savedReferences.push(current);
        saveToLocalStorage();
        renderSavedDrawer();
      }

      // Prompt user to pick save location for binary file download
      try {
        const response = await fetch(current.imageUrl);
        const blob = await response.blob();
        
        const ext = blob.type.split('/')[1] || 'jpg';
        const defaultName = `reference-${Date.now()}.${ext}`;

        if ('showSaveFilePicker' in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultName,
            types: [{
              description: 'Image File',
              accept: { [blob.type || 'image/jpeg']: [`.${ext}`] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        } else {
          // Fallback download trigger
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = defaultName;
          a.click();
        }
      } catch (err) {
        console.warn("Direct file save skipped or blocked by CORS:", err);
      }
    }

    function removeSavedItem(index) {
      savedReferences.splice(index, 1);
      saveToLocalStorage();
      renderSavedDrawer();
    }

    function clearAllSaved() {
      if (!savedReferences.length) return;
      if (confirm("Are you sure you want to clear all saved thumbnails?")) {
        savedReferences = [];
        saveToLocalStorage();
        renderSavedDrawer();
      }
    }

    /* SAVE & LOAD BOARD STATE */
    async function saveBoard() {
      const activePanes = [];
      panesData.forEach((state) => {
        activePanes.push({
          query: state.query,
          images: state.images,
          currentIndex: state.currentIndex,
          timerSeconds: state.timerSeconds,
          isPaused: state.isPaused,
          isGrayscale: state.isGrayscale,
          isFlipped: state.isFlipped,
          showGrid: state.showGrid
        });
      });

      const boardData = {
        version: "1.0",
        timestamp: new Date().toISOString(),
        panes: activePanes,
        savedReferences: savedReferences
      };

      const jsonString = JSON.stringify(boardData, null, 2);
      const blob = new Blob([jsonString], { type: "application/json" });
      const defaultName = `refview-board-${Date.now()}.json`;

      try {
        if ('showSaveFilePicker' in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultName,
            types: [{
              description: 'RefView Board File (*.json)',
              accept: { 'application/json': ['.json'] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = defaultName;
          a.click();
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error("Save Board failed:", err);
        }
      }
    }

    function triggerLoadBoard() {
      document.getElementById('boardFileInput').click();
    }

    function handleLoadBoard(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const boardData = JSON.parse(e.target.result);
          if (!boardData.panes) throw new Error("Invalid Board file format");

          // Clear existing workspace
          panesData.forEach((state, id) => removePane(id, true));
          panesData.clear();
          document.getElementById('workspace').innerHTML = '';
          paneCounter = 0;

          // Load Saved References
          if (Array.isArray(boardData.savedReferences)) {
            savedReferences = boardData.savedReferences;
            saveToLocalStorage();
            renderSavedDrawer();
          }

          // Restore Panes
          boardData.panes.forEach((pState) => {
            const paneId = addPane();
            if (paneId) {
              const state = panesData.get(paneId);
              state.query = pState.query || '';
              state.images = pState.images || [];
              state.currentIndex = pState.currentIndex || 0;
              state.timerSeconds = pState.timerSeconds || 0;
              state.isPaused = pState.isPaused || false;
              state.isGrayscale = pState.isGrayscale || false;
              state.isFlipped = pState.isFlipped || false;
              state.showGrid = pState.showGrid || false;

              document.getElementById(`input-${paneId}`).value = state.query;
              document.getElementById(`timer-select-${paneId}`).value = state.timerSeconds;

              if (state.images.length > 0) {
                displayCurrentImage(paneId);
                if (state.isGrayscale) toggleGrayscale(paneId);
                if (state.isFlipped) toggleFlip(paneId);
                if (state.showGrid) toggleGrid(paneId);
                if (!state.isPaused && state.timerSeconds > 0) startPaneTimer(paneId);
              }
            }
          });

        } catch (err) {
          alert("Could not parse Board file. Ensure it is a valid RefView .json file.");
          console.error(err);
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // Reset input
    }

    function updateWorkspaceLayout() {
      const workspace = document.getElementById('workspace');
      const count = panesData.size;
      workspace.setAttribute('data-panes', count);

      const addBtn = document.getElementById('addPaneBtn');
      if (addBtn) {
        addBtn.disabled = count >= MAX_PANES;
        addBtn.title = count >= MAX_PANES ? 'Maximum 6 panes reached' : '';
      }
    }

    function addPane() {
      if (panesData.size >= MAX_PANES) return null;

      paneCounter++;
      const paneId = paneCounter;

      const state = {
        id: paneId,
        query: '',
        images: [],
        currentIndex: 0,
        timerSeconds: 0,
        progressInterval: null,
        isPaused: false,
        isGrayscale: false,
        isFlipped: false,
        showGrid: false
      };

      panesData.set(paneId, state);

      const paneEl = document.createElement('div');
      paneEl.className = 'pane';
      paneEl.id = `pane-${paneId}`;
      paneEl.innerHTML = `
        <div class="timer-progress-container">
          <div id="progress-${paneId}" class="timer-progress-bar"></div>
        </div>

        <div class="pane-header">
          <form class="pane-search-form" onsubmit="handlePaneSearch(event, ${paneId})">
            <input type="text" id="input-${paneId}" class="pane-input" placeholder="Search reference..." />
            <button type="submit" class="btn btn-primary" style="padding: 4px 8px; font-size: 0.75rem;">Search</button>
          </form>

          <select id="timer-select-${paneId}" class="pane-timer-select" onchange="setPaneTimer(${paneId}, this.value)">
            <option value="0">Off</option>
            <option value="30">30s</option>
            <option value="60">1m</option>
            <option value="300">5m</option>
          </select>

          <button class="btn-tool" title="Close Pane" onclick="removePane(${paneId})">✕</button>
        </div>

        <div class="pane-viewport" id="viewport-${paneId}">
          <div class="empty-pane-state" id="empty-${paneId}">
            🔍 Enter a query above to load references
          </div>
          <div class="pane-image-wrapper" id="wrapper-${paneId}" style="display: none;">
            <img id="img-${paneId}" class="pane-img" src="" alt="Reference" />
            <div id="grid-${paneId}" class="grid-overlay">
              <div></div><div></div><div></div>
              <div></div><div></div><div></div>
              <div></div><div></div><div></div>
            </div>
          </div>
        </div>

        <div class="pane-footer">
          <div class="tool-group">
            <button id="btn-pause-${paneId}" class="btn-tool" title="Pause / Play" onclick="togglePause(${paneId})">⏸</button>
            <button class="btn-tool" title="Next Image (Fast Forward)" onclick="nextImage(${paneId})">⏭</button>
            <button id="btn-gray-${paneId}" class="btn-tool" title="Grayscale Toggle" onclick="toggleGrayscale(${paneId})">🎨</button>
            <button id="btn-flip-${paneId}" class="btn-tool" title="Flip Horizontal" onclick="toggleFlip(${paneId})">↔</button>
            <button id="btn-grid-tool-${paneId}" class="btn-tool" title="3x3 Composition Grid" onclick="toggleGrid(${paneId})">井</button>
          </div>
          <div class="tool-group">
            <button class="btn-tool" title="Save Reference" onclick="saveCurrentReference(${paneId})">💾 Save</button>
          </div>
        </div>
      `;

      document.getElementById('workspace').appendChild(paneEl);
      updateWorkspaceLayout();
      return paneId;
    }

    function openSavedInNewPane(imageUrl) {
      if (panesData.size >= MAX_PANES) {
        alert("Maximum limit of 6 panes reached. Please close a pane first.");
        return;
      }

      const paneId = addPane();
      if (!paneId) return;

      const state = panesData.get(paneId);
      state.images = [{ imageUrl: imageUrl }];
      state.currentIndex = 0;
      state.timerSeconds = 0;
      state.isPaused = true;

      document.getElementById(`input-${paneId}`).value = 'Saved Reference';
      document.getElementById(`timer-select-${paneId}`).value = '0';
      
      const btnPause = document.getElementById(`btn-pause-${paneId}`);
      if (btnPause) {
        btnPause.textContent = '⏸';
        btnPause.classList.add('active');
      }

      displayCurrentImage(paneId);
    }

    function removePane(id, skipLayoutUpdate = false) {
      if (panesData.size <= 1 && !skipLayoutUpdate) return;
      pausePaneTimer(id);
      panesData.delete(id);
      const el = document.getElementById(`pane-${id}`);
      if (el) el.remove();
      if (!skipLayoutUpdate) updateWorkspaceLayout();
    }

    async function handlePaneSearch(event, id) {
      if (event) event.preventDefault();

      const state = panesData.get(id);
      const query = document.getElementById(`input-${id}`).value.trim();
      if (!query) return;

      state.query = query;
      state.currentIndex = 0;

      try {
        const response = await fetch(`/.netlify/functions/search?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error("Search service failed");

        const data = await response.json();
        if (data.images && data.images.length > 0) {
          state.images = data.images;
          displayCurrentImage(id);
          startPaneTimer(id);
        } else {
          alert(`No reference images found for "${query}"`);
        }
      } catch (err) {
        console.warn("Proxy unavailable:", err);
        alert("Search endpoint unavailable. Ensure Netlify proxy is deployed.");
      }
    }

    function displayCurrentImage(id) {
      const state = panesData.get(id);
      if (!state.images.length) return;

      const img = document.getElementById(`img-${id}`);
      const wrapper = document.getElementById(`wrapper-${id}`);
      const empty = document.getElementById(`empty-${id}`);

      const currentItem = state.images[state.currentIndex];
      img.src = currentItem.imageUrl;

      empty.style.display = 'none';
      wrapper.style.display = 'flex';
    }

    function nextImage(id) {
      const state = panesData.get(id);
      if (!state.images.length) return;

      state.currentIndex = (state.currentIndex + 1) % state.images.length;
      displayCurrentImage(id);
      resetTimerProgress(id);
    }

    function setPaneTimer(id, seconds) {
      const state = panesData.get(id);
      state.timerSeconds = parseInt(seconds, 10);
      startPaneTimer(id);
    }

    function startPaneTimer(id) {
      pausePaneTimer(id);
      const state = panesData.get(id);

      if (state.timerSeconds <= 0 || state.isPaused || !state.images.length) return;

      let elapsed = 0;
      const total = state.timerSeconds * 1000;
      const intervalTime = 100;

      state.progressInterval = setInterval(() => {
        elapsed += intervalTime;
        const pct = Math.min((elapsed / total) * 100, 100);
        document.getElementById(`progress-${id}`).style.width = `${pct}%`;

        if (elapsed >= total) {
          nextImage(id);
          elapsed = 0;
        }
      }, intervalTime);
    }

    function pausePaneTimer(id) {
      const state = panesData.get(id);
      if (state && state.progressInterval) {
        clearInterval(state.progressInterval);
        state.progressInterval = null;
      }
    }

    function resetTimerProgress(id) {
      document.getElementById(`progress-${id}`).style.width = '0%';
      startPaneTimer(id);
    }

    function togglePause(id) {
      const state = panesData.get(id);
      state.isPaused = !state.isPaused;
      const btn = document.getElementById(`btn-pause-${id}`);
      btn.textContent = state.isPaused ? '▶' : '⏸';
      btn.classList.toggle('active', state.isPaused);

      if (state.isPaused) {
        pausePaneTimer(id);
      } else {
        startPaneTimer(id);
      }
    }

    function toggleGrayscale(id) {
      const state = panesData.get(id);
      state.isGrayscale = !state.isGrayscale;
      document.getElementById(`img-${id}`).classList.toggle('grayscale', state.isGrayscale);
      document.getElementById(`btn-gray-${id}`).classList.toggle('active', state.isGrayscale);
    }

    function toggleFlip(id) {
      const state = panesData.get(id);
      state.isFlipped = !state.isFlipped;
      document.getElementById(`img-${id}`).classList.toggle('flipped', state.isFlipped);
      document.getElementById(`btn-flip-${id}`).classList.toggle('active', state.isFlipped);
    }

    function toggleGrid(id) {
      const state = panesData.get(id);
      state.showGrid = !state.showGrid;
      document.getElementById(`grid-${id}`).classList.toggle('active', state.showGrid);
      document.getElementById(`btn-grid-tool-${id}`).classList.toggle('active', state.showGrid);
    }

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
    }
  </script>
</body>
</html>
