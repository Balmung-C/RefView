<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Pane Viewer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Application Bar */
        .app-bar {
            background-color: #18181b;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Top Bar Back to Portal Button */
        .btn-back-portal {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
        }

        .btn-back-portal:hover {
            background-color: #1d4ed8;
        }

        .app-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }

        /* Grid Container for Panes */
        .pane-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }

        /* Individual Pane Card */
        .pane {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Pane Header */
        .pane-header {
            background-color: #282828;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .pane-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #aaa;
        }

        /* Image Display Area */
        .pane-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            min-height: 250px;
            position: relative;
        }

        .pane-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Footer Toolbar Navigation */
        .pane-footer {
            padding: 8px 12px;
            background-color: #282828;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-group {
            display: flex;
            gap: 4px;
        }

        .nav-btn {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.15s;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #444;
        }

        .counter-text {
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Main Top Application Bar -->
    <header class="app-bar">
        <div class="app-bar-left">
            <button class="btn-back-portal" onclick="returnToPortal()" title="Return to Portal Hub">
                &#129144; Back to Portal
            </button>
            <div class="app-title">Workstation Viewer</div>
        </div>
    </header>

    <main class="pane-container">
        <!-- Pane 1 -->
        <div class="pane" id="pane-1">
            <div class="pane-header">
                <span class="pane-title">Pane 1</span>
            </div>
            <div class="pane-content">
                <img id="img-1" src="https://picsum.photos/id/10/600/400" alt="Image 1">
            </div>
            <div class="pane-footer">
                <div class="nav-group">
                    <button class="nav-btn" onclick="firstImage(1)" title="First Image">&#11148;</button>
                    <button class="nav-btn" onclick="prevImage(1)" title="Previous Image">&#9664;</button>
                    <button class="nav-btn" onclick="nextImage(1)" title="Next Image">&#9654;</button>
                    <button class="nav-btn" onclick="lastImage(1)" title="Last Image">&#11151;</button>
                </div>
                <span class="counter-text" id="counter-1">Image 1 of 1</span>
            </div>
        </div>

        <!-- Pane 2 -->
        <div class="pane" id="pane-2">
            <div class="pane-header">
                <span class="pane-title">Pane 2</span>
            </div>
            <div class="pane-content">
                <img id="img-2" src="https://picsum.photos/id/20/600/400" alt="Image 2">
            </div>
            <div class="pane-footer">
                <div class="nav-group">
                    <button class="nav-btn" onclick="firstImage(2)" title="First Image">&#11148;</button>
                    <button class="nav-btn" onclick="prevImage(2)" title="Previous Image">&#9664;</button>
                    <button class="nav-btn" onclick="nextImage(2)" title="Next Image">&#9654;</button>
                    <button class="nav-btn" onclick="lastImage(2)" title="Last Image">&#11151;</button>
                </div>
                <span class="counter-text" id="counter-2">Image 1 of 1</span>
            </div>
        </div>
    </main>

    <script>
        // State tracking for each pane's history
        const paneState = {
            1: { history: ['https://picsum.photos/id/10/600/400'], index: 0 },
            2: { history: ['https://picsum.photos/id/20/600/400'], index: 0 }
        };

        // App Bar Portal Navigation
        function returnToPortal() {
            alert('Navigating back to main portal...');
            // Example: window.location.href = '/portal';
        }

        // Image History Control Functions
        function updatePane(paneId) {
            const state = paneState[paneId];
            document.getElementById(`img-${paneId}`).src = state.history[state.index];
            document.getElementById(`counter-${paneId}`).innerText = `Image ${state.index + 1} of ${state.history.length}`;
        }

        function firstImage(paneId) {
            paneState[paneId].index = 0;
            updatePane(paneId);
        }

        function prevImage(paneId) {
            if (paneState[paneId].index > 0) {
                paneState[paneId].index--;
                updatePane(paneId);
            }
        }

        function nextImage(paneId) {
            const state = paneState[paneId];
            if (state.index < state.history.length - 1) {
                state.index++;
            } else {
                const randomId = Math.floor(Math.random() * 100) + 10;
                const newUrl = `https://picsum.photos/id/${randomId}/600/400`;
                state.history.push(newUrl);
                state.index++;
            }
            updatePane(paneId);
        }

        function lastImage(paneId) {
            const state = paneState[paneId];
            state.index = state.history.length - 1;
            updatePane(paneId);
        }
    </script>
</body>
</html>
